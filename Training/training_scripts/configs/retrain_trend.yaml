# configs/retrain_trend.yaml
# Retraining configuration for XGBoost trend detection

model_type: XGBOOST_TREND
task_type: trend
model_id: trend_xgb_retrain
model_family: xgboost
training_mode: retraining
initial_status: CANDIDATE

# Feedback collection
feedback_source: file
feedback_path: s3://production-logs/serving/feedback/trend/

# Trigger settings
schedule_days: 4
lookback_days: 4
feedback_trigger_enabled: false
min_feedback_signals: 10
last_retrain_date: null

# Phase 2 fine-tuning hyperparameters (Section 5.2.2)
n_estimators: 100              # 50-100 additional trees for per-user
max_depth: 6
phase2_learning_rate: 0.01     # Per-user fine-tuning rate
reg_alpha: 0.2                 # Increased regularization
reg_lambda: 2.0

# External data
external_data_path: /data/trend_training.parquet
retraining_output_root: s3://retraining-data
dynamic_mix_tiers:
  - min_user_rows: 0
    production_share: 0.10
  - min_user_rows: 25
    production_share: 0.20
  - min_user_rows: 50
    production_share: 0.30
  - min_user_rows: 100
    production_share: 0.40
  - min_user_rows: 200
    production_share: 0.50

# Drift detection
reference_features_path: /data/reference_trend_features.parquet
current_features_path: /data/current_trend_features.parquet

# Promotion
mlflow_tracking_uri: http://CHAMELEON_FLOATING_IP:8000
experiment_name: trend_retrain
direct_artifact_experiment_name: trend_retrain_s3
artifact_location: s3://mlflow/experiments/trend_retrain_s3
registry_path: s3://mlflow/registry
comparison_active_models_file: active_models.json
target_active_models_file: active_models_canary.json
promotion_channel: canary

# State persistence
state_file: /data/retrain_state_trend.json
retrain_data_path: /tmp/retrain_trend.parquet
