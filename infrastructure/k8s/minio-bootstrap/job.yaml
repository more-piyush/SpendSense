apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bootstrap
  namespace: firefly-platform
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-bootstrap
          image: minio/mc:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              connected="false"
              for attempt in $(seq 1 30); do
                if mc alias set local http://minio.firefly-platform.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; then
                  connected="true"
                  break
                fi
                echo "[INFO] Waiting for MinIO API to accept connections... attempt ${attempt}/30"
                sleep 5
              done

              if [ "${connected}" != "true" ]; then
                echo "[ERROR] MinIO API did not become ready in time."
                exit 1
              fi

              mc mb -p local/mlflow || true
              mc mb -p local/training-data || true
              mc mb -p local/processed-data || true
              mc mb -p local/production-logs || true
              echo "[INFO] MinIO buckets ready"
          envFrom:
            - secretRef:
                name: minio-secret
