apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving-canary
  namespace: firefly-platform
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: spendsense-serving
      app.kubernetes.io/component: api
      app.kubernetes.io/instance: canary
  template:
    metadata:
      labels:
        app: spendsense-serving
        app.kubernetes.io/name: spendsense-serving
        app.kubernetes.io/component: api
        app.kubernetes.io/instance: canary
        spendsense.ai/channel: canary
        spendsense.ai/public-route: "true"
    spec:
      containers:
        - name: serving-canary
          image: docker.io/spendsense/serving-unified:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVING_ENVIRONMENT
              value: canary
            - name: SERVING_SERVICE_NAME
              value: serving-canary
            - name: ACTIVE_MODELS_PATH
              value: s3://mlflow/registry/active_models_canary.json
            - name: S3_ENDPOINT_URL
              value: http://minio.firefly-platform.svc.cluster.local:9000
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_USER
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_PASSWORD
            - name: FEEDBACK_STORE_PATH
              value: /tmp/spendsense-serving-feedback-canary.jsonl
            - name: PRODUCTION_LOGS_BUCKET
              value: production-logs
            - name: PRODUCTION_LOGS_PREFIX
              value: serving-canary
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "4Gi"
